name: test-deploy

on:
  push:
    branches: [v1.0.x]

permissions:
  contents: read

concurrency:
  group: test-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14.19
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        env:
          POSTGRES_USER: consul
          POSTGRES_PASSWORD: password
    env:
      PGUSER: consul
      PGPASSWORD: password
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: ".node-version"
      - run: npm clean-install
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Remove image-bundled Chrome
        run: sudo apt-get purge -y google-chrome-stable
      - name: Setup Chrome/Chromium 128
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 128
          install-chromedriver: true
          install-dependencies: true
      - name: Copy secrets and database files
        run: for i in config/*.example; do cp "$i" "${i/.example}"; done
      - run: bundle exec rake db:setup
      - name: Run smoke suite
        run: |
          bundle exec rspec \
            spec/models/user_spec.rb \
            spec/models/proposal_spec.rb \
            spec/models/debate_spec.rb \
            spec/models/budget_spec.rb \
            spec/system/welcome_spec.rb \
            spec/system/users_auth_spec.rb
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: tmp/capybara/

  build-and-push:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/odi76/consuldemocracy
    steps:
      - uses: actions/checkout@v6
      - name: Write git SHA for version endpoint
        run: echo "${{ github.sha }}" > .git-sha
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=consul
          cache-to: type=gha,mode=max,scope=consul

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Restart vps-consul on VPS
        # Remote command is ignored: the key is locked to a forced command
        run: >
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=60
          "$DEPLOY_USER@$DEPLOY_HOST" deploy
      - name: Verify new version is live
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE_URL: ${{ secrets.DEPLOY_SITE_URL }}
        run: |
          for i in $(seq 1 60); do
            VERSION_SHA=$(curl -sf "$SITE_URL/version.json" \
              | jq -r '.sha // empty' 2>/dev/null || true)
            MAIN_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/" 2>/dev/null; true)
            if [ "$VERSION_SHA" = "$EXPECTED_SHA" ] && [ "$MAIN_STATUS" = "401" ]; then
              echo "Deploy verified: SHA=$VERSION_SHA, site requires auth (401)"
              exit 0
            fi
            echo "Attempt $i/60: SHA=$VERSION_SHA (expected $EXPECTED_SHA), status=$MAIN_STATUS — retrying in 5s"
            sleep 5
          done
          echo "Deploy verification failed after 5 minutes"
          exit 1
